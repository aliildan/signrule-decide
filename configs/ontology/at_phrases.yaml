# Austrian joint-representation partner phrases -> CIR partner role (plan-12, owner decision
# 2026-10-06: rule-derived "silver" structure labels, CLAUDE.md §2.1 exception).
#
# A representing function coded G ("gemeinsame Vertretung") whose text reads
#   "vertritt seit <date> gemeinsam mit <partner> [oder <partner> …]"
# gets one AND-group per partner: {holder's office: 1, partner role: 1} ("weiteren", "zweiten",
# "anderen" only say the partner is another person; groups always count distinct people).
# Every partner phrase must match an entry EXACTLY after normalisation (lower case, single spaces,
# no trailing punctuation, leading "gemeinsam mit"/"mit" removed); otherwise the company gets no
# structure labels. Entries were written by hand from the partner phrases shared by >= 20 companies
# (aggregate of 2026-10-06, 89 % of all partner-phrase uses), reviewed, never generated. Named
# partners ("Person A", [PERSON_n]) are never in the table (person-specific -> no label).
