# plan-17 / design-05: the Strands Decider-format model for Ollama (StrandsDeciderForDecision).
# C″'s data and labels (NO + AT random train), Strands Decider's recipe defaults on the same torso
# as C″. Paths, KL/teacher/KL-only knobs and init_from are set or refused by strands_wrapper.
name: strands-4b-v1
jurisdictions: ["no", "at"]
split: random
strands:
  base_model: Qwen/Qwen3.5-4B-Base
  head_type: pointer
  pointer_dim: 256
  head_init: random
  head_dropout: 0.05
  # training window: covers every training row (longest 4,321 tokens); the serving window is
  # written into the export
  max_length: 8192
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  # attention and MLP projections plus the Gated DeltaNet layers' own (Strands' Qwen3.5 list)
  lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
                 "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
  freeze_torso: false
  epochs: 1
  micro_batch_size: 8
  grad_accum: 4
  lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  gradient_checkpointing: true
  # option order only (text and labels unchanged), as Kev's per-epoch shuffle
  shuffle_options: true
  reverse_score_prob: 0.5
  group_by_length: true
  ordinal_smoothing: 0.1
  seed: 13
  log_every: 20
  eval_every: 2000
  save_every: 0
